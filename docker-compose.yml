services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-bot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_bot}
      POSTGRES_USER: ${POSTGRES_USER:-ai_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_bot_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-bot-backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_bot}:${POSTGRES_PASSWORD:-ai_bot_password}@postgres:5432/${POSTGRES_DB:-ai_bot}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: ai-bot-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
