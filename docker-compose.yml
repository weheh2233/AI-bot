services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-bot-postgres
    environment:
      POSTGRES_DB: ai_bot
      POSTGRES_USER: ai_bot
      POSTGRES_PASSWORD: ai_bot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: