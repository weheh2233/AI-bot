[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bot"
version = "0.1.0"
description = "LangChain and LangGraph based knowledge assistant backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.14,<2.0",
    "bcrypt>=5.0,<6.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-postgres>=0.0.16,<1.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "PyJWT>=2.10,<3.0",
    "pymupdf>=1.25,<2.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "python-pptx>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "trafilatura>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # LangGraph 的 Runtime.context 用泛型 TypeVar 却标 default=None，pydantic 序列化
    # checkpoint 时误报；属框架缺陷，功能无影响。同上，也不影响测试。
    "ignore:Pydantic serializer warnings:UserWarning",
    # TestClient 传 timeout 触发的 starlette 弃用提示，非产品问题。
    "ignore:You should not use the 'timeout' argument with the TestClient",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.setuptools.packages.find]
include = ["app*"]
